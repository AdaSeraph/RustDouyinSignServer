syntax = "proto3";

package douyin.webcast;

// ============================================================================
// Douyin Webcast IM Push v2 Protobuf Definitions
// Notice: Strictly for educational & learning purposes (MIT License).
// ============================================================================

message HeadersList {
  string key = 1;
  string value = 2;
}

message PushFrame {
  uint64 seq_id = 1;
  uint64 log_id = 2;
  uint64 service = 3;
  uint64 method = 4;
  repeated HeadersList headers_list = 5;
  string payload_encoding = 6;
  string payload_type = 7;
  bytes payload = 8;
}

message Message {
  string method = 1;
  bytes payload = 2;
  int64 msg_id = 3;
  int32 msg_type = 4;
  int64 offset = 5;
  bool need_wrds_store = 6;
  int64 wrds_version = 7;
  string wrds_sub_key = 8;
}

message Response {
  repeated Message messages_list = 1;
  string cursor = 2;
  uint64 fetch_interval = 3;
  uint64 now = 4;
  string internal_ext = 5;
  uint32 fetch_type = 6;
  map<string, string> route_params = 7;
  uint64 heartbeat_duration = 8;
  bool need_ack = 9;
  string push_server = 10;
  string live_cursor = 11;
  bool history_no_more = 12;
}

message Common {
  string method = 1;
  uint64 msg_id = 2;
  uint64 room_id = 3;
  uint64 create_time = 4;
  uint32 monitor = 5;
  bool is_show_msg = 6;
  string describe = 7;
  uint64 fold_type = 9;
  uint64 anchor_fold_type = 10;
  uint64 priority_score = 11;
}

message User {
  uint64 id = 1;
  uint64 short_id = 2;
  string nick_name = 3;
  uint32 gender = 4;
  string signature = 5;
  uint32 level = 6;
  uint64 birthday = 7;
  string telephone = 8;
  string display_id = 38;
  string sec_uid = 46;
}

// WebcastChatMessage — 直播间弹幕评论
message ChatMessage {
  Common common = 1;
  User user = 2;
  string content = 3;
  bool visible_to_sender = 4;
}

message GiftStruct {
  string describe = 2;
  uint64 id = 5;
  uint32 diamond_count = 12;
  string name = 16;
}

// WebcastGiftMessage — 直播间送礼消息
message GiftMessage {
  Common common = 1;
  uint64 gift_id = 2;
  uint64 fan_ticket_count = 3;
  uint64 group_count = 4;
  uint64 repeat_count = 5;
  uint64 combo_count = 6;
  User user = 7;
  User to_user = 8;
  uint32 repeat_end = 9;
  GiftStruct gift = 15;
}

// WebcastMemberMessage — 用户进入直播间
message MemberMessage {
  Common common = 1;
  User user = 2;
  uint64 member_count = 3;
  User operator = 4;
  bool is_set_to_admin = 5;
  bool is_top_user = 6;
  uint64 rank_score = 7;
  uint64 top_user_no = 8;
  uint64 enter_type = 9;
  uint64 action = 10;
  string action_description = 11;
}

// WebcastLikeMessage — 点赞消息
message LikeMessage {
  Common common = 1;
  uint64 count = 2;
  uint64 total = 3;
  uint64 color = 4;
  User user = 5;
}

// WebcastSocialMessage — 关注/分享等社交消息
message SocialMessage {
  Common common = 1;
  User user = 2;
  uint64 share_type = 3;
  uint64 action = 4;
  string share_target = 5;
  uint64 follow_count = 6;
}

// WebcastRoomUserSeqMessage — 直播间在线人数统计
message RoomUserSeqMessage {
  Common common = 1;
  int64 total = 3;
  string pop_str = 4;
  int64 popularity = 6;
  int64 total_user = 7;
  string total_pv_for_anchor = 8;
}

// WebcastControlMessage — 直播间状态控制（如暂停、下播）
message ControlMessage {
  Common common = 1;
  int64 status = 2;
}
