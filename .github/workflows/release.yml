name: Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, short: windows-x64, ext: .exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, short: windows-arm64, ext: .exe }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, short: linux-x64, ext: "", musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, short: linux-arm64, ext: "", musl: true }
          - { os: macos-latest, target: x86_64-apple-darwin, short: macos-x64, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, short: macos-arm64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="latest"
          fi
          bin=douyin-sign-server-rust
          name=$bin-$tag-${{ matrix.short }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/$bin${{ matrix.ext }} dist/$name/
          cp -r scripts static config.example.toml LICENSE README.md dist/$name/
          # standalone single-file executable (JS script and Web GUI are embedded)
          cp target/${{ matrix.target }}/release/$bin${{ matrix.ext }} dist/$bin-${{ matrix.short }}${{ matrix.ext }}
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a $name.zip $name; else tar czf $name.tar.gz $name; fi
          rm -rf $name
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "is_rolling=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "title=Latest Build (${short_sha})" >> "$GITHUB_OUTPUT"
            echo "is_rolling=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update rolling latest tag
        if: steps.meta.outputs.is_rolling == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push -f origin latest
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
          body: |
            > [!CAUTION]
            > 仅供个人学习与非商业技术研究，严禁商业及任何违法违规用途。使用本项目产生的一切后果与法律责任由使用者本人承担，与作者无关。下载即视为同意 LICENSE 全部条款。
            > For learning & non-commercial research only. Users bear sole legal responsibility. Downloading means you accept the LICENSE.

            Commit: `${{ github.sha }}`
            Docker: `docker pull ghcr.io/adaseraph/rustdouyinsignserver:${{ steps.meta.outputs.tag }}`

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/adaseraph/rustdouyinsignserver
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
